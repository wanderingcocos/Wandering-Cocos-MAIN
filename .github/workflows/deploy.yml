name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - redesign

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Approve builds for esbuild and sharp
        run: |
          pnpm approve-builds --yes || true
          echo "onlyBuiltDependencies[]=esbuild" >> .npmrc
          echo "onlyBuiltDependencies[]=sharp" >> .npmrc
          pnpm install

      - name: Build frontend
        run: BASE_PATH=/ pnpm --filter @workspace/wandering-cocos run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: artifacts/wandering-cocos/dist/public/
          server-dir: /public_html/
          dangerous-clean-slate: false
